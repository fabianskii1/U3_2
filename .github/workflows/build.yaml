name: Build backend image

on:
  pull_request:
    paths:
      - BE/**
      - .github/workflows/build.yaml
  push:
    branches: [main]
    paths:
      - BE/**
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  BE_IMAGE: harbor.skala-us.com/u3-2/backend:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb:2.32.0-pg17
        env:
          POSTGRES_DB: ci_backend
          POSTGRES_USER: ci_backend
          POSTGRES_PASSWORD: ci_backend_only
          NO_TS_TUNE: 'true'
          TIMESCALEDB_TELEMETRY: 'off'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_backend -d ci_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ci_backend:ci_backend_only@127.0.0.1:5432/ci_backend
      AI_BASE_URL: http://127.0.0.1:9
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'

      - name: Install frozen dependencies
        working-directory: BE
        run: uv sync --frozen

      - name: Check migration graph
        working-directory: BE
        run: uv run --frozen python scripts/check_migration_heads.py

      - name: Prepare disposable database
        env:
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec "$DB_CONTAINER" psql -U ci_backend -d ci_backend -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS timescaledb;' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          cd BE
          uv run --frozen alembic upgrade head

      - name: Run backend checks
        working-directory: BE
        run: |
          uv run --frozen ruff check app migrations scripts tests
          uv run --frozen pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./BE
          file: ./BE/deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.BE_IMAGE }}

      - name: Test backend startup and database reads
        env:
          CI_NETWORK: ${{ job.services.db.network }}
        run: bash BE/deploy/ci-smoke.sh "$BE_IMAGE" "$CI_NETWORK"

      - name: Log in to Harbor
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: harbor.skala-us.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push tested backend image
        if: github.event_name == 'push'
        run: docker push "$BE_IMAGE"
