name: Build frontend image

on:
  push:
    branches: [main]
    paths:
      - fe/**
      - .github/workflows/build-fe.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  FE_IMAGE: harbor.skala-us.com/u3-2/frontend:${{ github.sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Run all frontend unit tests
        working-directory: fe
        env:
          VITE_API_MODE: mock
        run: npm test

      - name: Build production frontend
        working-directory: fe
        env:
          VITE_API_MODE: remote
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./fe
          file: ./fe/deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.FE_IMAGE }}

      - name: Test frontend assets, routing and API proxy
        run: bash fe/deploy/ci-smoke.sh "$FE_IMAGE"

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.skala-us.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push tested frontend image
        run: docker push "$FE_IMAGE"
