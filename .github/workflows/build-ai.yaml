name: Build AI image

on:
  push:
    branches: [main]
    paths:
      - AI/**
      - .github/workflows/build-ai.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_IMAGE: harbor.skala-us.com/u3-2/ai:${{ github.sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.13"
          python-version: "3.12"
          working-directory: AI

      - name: Install frozen AI dependencies
        working-directory: AI
        run: uv sync --frozen --group dev

      - name: Lint AI
        working-directory: AI
        run: uv run --frozen --no-sync ruff check app tests

      - name: Test AI without model calls
        working-directory: AI
        run: uv run --frozen --no-sync pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AI image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./AI
          file: ./AI/deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.AI_IMAGE }}

      - name: Test AI startup and missing-key response
        run: bash AI/deploy/ci-smoke.sh "$AI_IMAGE"

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.skala-us.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push tested AI image
        run: docker push "$AI_IMAGE"
