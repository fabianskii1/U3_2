name: Build database image

on:
  push:
    branches: [main]
    paths:
      - DB/docker/**
      - .github/workflows/build-db.yaml
  pull_request:
    branches: [main]
    paths:
      - DB/docker/**
      - .github/workflows/build-db.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_IMAGE: harbor.skala-us.com/u3-2/db:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build database image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./DB/docker
          file: ./DB/docker/Dockerfile.db
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.DB_IMAGE }}

      - name: Test database startup and extensions
        run: bash DB/docker/ci-smoke.sh "$DB_IMAGE"

      - name: Log in to Harbor
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: harbor.skala-us.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push tested database image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "$DB_IMAGE"
