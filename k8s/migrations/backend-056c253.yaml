apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-056c253
  namespace: u3-2
  labels:
    app: backend
    component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: backend-migration
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: harbor.skala-us.com/u3-2/backend:056c253625e73639604ab088ca475cfa675f61d7
          imagePullPolicy: IfNotPresent
          command: ["alembic"]
          args: ["upgrade", "9a6d82f0c713"]
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
