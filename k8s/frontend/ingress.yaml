apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: u3-2
  labels:
    app: frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - u3-2.skala-us.com
      secretName: team-tls
  rules:
    - host: u3-2.skala-us.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
