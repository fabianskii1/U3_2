apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: u3-2
  labels:
    app: db
  annotations:
    # Retain the DB disk when manifests or the Argo CD Application are removed.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: ebs-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
