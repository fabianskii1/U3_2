apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: u3-2
  labels:
    app: db
spec:
  type: ClusterIP
  # Governs db-0's stable DNS; BE can also connect using db:5432.
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
