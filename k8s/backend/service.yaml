apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: u3-2
  labels:
    app: backend
    role: active
spec:
  type: ClusterIP
  selector:
    app: backend
    slot: green
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-preview
  namespace: u3-2
  labels:
    app: backend
    role: preview
spec:
  type: ClusterIP
  selector:
    app: backend
    slot: blue
  ports:
    - name: http
      port: 8000
      targetPort: http
