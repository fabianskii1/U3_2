apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-blue
  namespace: u3-2
  labels:
    app: backend
    slot: blue
spec:
  replicas: 1
  minReadySeconds: 5
  revisionHistoryLimit: 2
  strategy:
    # Replace this slot only while the active Service selects the other slot.
    type: Recreate
  selector:
    matchLabels:
      app: backend
      slot: blue
  template:
    metadata:
      labels:
        app: backend
        slot: blue
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: backend-blue-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
            - name: AI_BASE_URL
              value: http://ai:8001
            - name: CORS_ORIGINS
              value: '["https://u3-2.skala-us.com"]'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          # /health checks the DB too; withhold traffic while it is unavailable.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # A DB outage should not trigger BE restarts via /health.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
