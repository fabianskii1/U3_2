apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: u3-2
  labels:
    app: backend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - u3-2.skala-us.com
      secretName: team-tls
  rules:
    - host: u3-2.skala-us.com
      http:
        paths:
          # BE already defines /api routes; preserve the request path.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
